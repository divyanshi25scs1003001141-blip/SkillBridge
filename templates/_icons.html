{#
  _icons.html - small reusable icons.
  Use in any template:
      {% from "_icons.html" import icon, logo_mark %}
      {{ icon("check", 18) }}
#}

{% macro logo_mark(size=20) %}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 22h24"/>
    <path d="M10 9v13M22 9v13"/>
    <path d="M10 9q6 9 12 0"/>
    <path d="M4 22q4-1 6-13M28 22q-4-1-6-13"/>
</svg>
{% endmacro %}

{% macro icon(name, size=22) %}
<svg class="icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    {% if name == "check" %}
        <polyline points="20 6 9 17 4 12"/>
    {% elif name == "menu" %}
        <line x1="4" x2="20" y1="7" y2="7"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="17" y2="17"/>
    {% elif name == "clipboard" %}
        <rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>
    {% elif name == "route" %}
        <circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/>
    {% elif name == "target" %}
        <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>
    {% elif name == "book" %}
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
    {% elif name == "folder" %}
        <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9L9.6 3.9A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>
    {% elif name == "flag" %}
        <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/>
    {% elif name == "file" %}
        <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/>
    {% elif name == "shield" %}
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>
    {% elif name == "dashboard" %}
        <rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>
    {% elif name == "user" %}
        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
    {% elif name == "logout" %}
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>
    {% elif name == "map" %}
        <path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><line x1="9" x2="9" y1="4" y2="18"/><line x1="15" x2="15" y1="6" y2="20"/>
    {% elif name == "chart" %}
        <line x1="4" x2="4" y1="20" y2="10"/><line x1="10" x2="10" y1="20" y2="4"/><line x1="16" x2="16" y1="20" y2="12"/><line x1="21" x2="21" y1="20" y2="7"/>
    {% elif name == "code" %}
        <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
    {% elif name == "link" %}
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
    {% elif name == "x" %}
        <line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/>
    {% elif name == "chevrons-left" %}
        <polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/>
    {% elif name == "arrow-right" %}
        <line x1="4" x2="20" y1="12" y2="12"/><polyline points="14 6 20 12 14 18"/>
    {% elif name == "sun" %}
        <circle cx="12" cy="12" r="4"/><line x1="12" x2="12" y1="2" y2="4"/><line x1="12" x2="12" y1="20" y2="22"/><line x1="2" x2="4" y1="12" y2="12"/><line x1="20" x2="22" y1="12" y2="12"/><line x1="4.9" x2="6.3" y1="4.9" y2="6.3"/><line x1="17.7" x2="19.1" y1="17.7" y2="19.1"/><line x1="4.9" x2="6.3" y1="19.1" y2="17.7"/><line x1="17.7" x2="19.1" y1="6.3" y2="4.9"/>
    {% elif name == "moon" %}
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
    {% elif name == "search" %}
        <circle cx="11" cy="11" r="7"/><line x1="16.5" x2="21" y1="16.5" y2="21"/>
    {% elif name == "sparkle" %}
        <path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><path d="m6.5 6.5 2 2M15.5 15.5l2 2M17.5 6.5l-2 2M8.5 15.5l-2 2"/>
    {% endif %}
</svg>
{% endmacro %}
